[workspace]
resolver = "2"
members = [
    "crates/klav-core",
    "crates/klav-io",
    "crates/klav-engine",
    "crates/klav-layout",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/SamiraJato/klav"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
